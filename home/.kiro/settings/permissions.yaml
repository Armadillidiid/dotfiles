rules:
  - capability: fs_read
    match:
      - "~/ghq/**"
      - "~/.config/**"
      - "~/.dotfiles/**"
      - "~/.local/share/opencode/**"
    effect: allow
  - capability: fs_write
    match:
      - "~/ghq/**"
      - "~/.config/**"
      - "~/.dotfiles/**"
      - "~/.local/share/opencode/**"
    effect: allow
